name: AirYak Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Native Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and Unity submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Run native component tests with coverage
        run: |
          chmod +x ./run_tests.sh
          ./run_tests.sh --coverage

      - name: Generate Coverage Summary
        id: coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Add Coverage Summary to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Extract Line Coverage Percentage
        id: cov_pct
        run: |
          PCT=$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage.xml').getroot(); print(round(float(r.attrib['line-rate'])*100, 1))")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - name: Update Dynamic Coverage Badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: e2ac8fedaee1cf59a777912540685551
          filename: airyak-coverage.json
          label: coverage
          message: ${{ steps.cov_pct.outputs.pct }}%
          valColorRange: ${{ steps.cov_pct.outputs.pct }}
          minColorRange: 60
          maxColorRange: 90

  lint-and-build:
    name: Firmware Build & Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install clang-tidy and AVR headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy gcc-avr avr-libc

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "PID" "Servo"

      - name: Verify release and debug firmware builds
        run: |
          arduino-cli compile --fqbn arduino:avr:uno --libraries ./lib .
          arduino-cli compile --fqbn arduino:avr:uno --libraries ./lib \
            --build-property "compiler.cpp.extra_flags=-DAIRYAK_DEBUG" .

      - name: Run clang-tidy static analysis
        run: |
          chmod +x ./lint.sh
          ./lint.sh
